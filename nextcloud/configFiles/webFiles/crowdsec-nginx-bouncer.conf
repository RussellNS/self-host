# == LAPI Connection ==============================================
# URL of the central CrowdSec Local API (on the Pi). This is where
# the bouncer fetches the IP ban/decision stream from — separate
# from AppSec, which is local to this stack.
API_URL=http://lapi.example.com:8080

# Bouncer API key, registered on the LAPI via `cscli bouncers add`.
# Authenticates this Nginx instance to pull decisions from LAPI.
API_KEY=change-me



# == AppSec / WAF Forwarding ======================================
# Endpoint of the local AppSec engine that inline-inspects request
# bodies/headers/params for malicious payloads (SQLi, XSS, path
# traversal, CVE-specific exploits, etc.). This is NOT the LAPI —
# it's the per-stack CrowdSec container's AppSec listener, reached
# here via the Docker Compose service name 'crowdsec' on the shared
# 'default' network, since these are separate containers.
APPSEC_URL=http://crowdsec:7422

# What to do if the AppSec call itself fails (timeout, connection
# refused, AppSec container down, etc.) — distinct from AppSec
# successfully evaluating and blocking a request.
#   passthrough = let the request through (fail-open) if AppSec is
#                 unreachable, so an AppSec outage doesn't take down
#                 the whole site
#   (some versions support a fail-closed alternative if you want
#   stricter behavior once this is proven stable)
APPSEC_FAILURE_ACTION=passthrough



# == IP Reputation Bouncing Behavior ===============================
# Which decision types to enforce. 'all' bounces every decision
# type LAPI returns (ban, captcha, etc.), not just IP bans.
BOUNCING_ON_TYPE=all

# How the bouncer fetches decisions from LAPI.
#   stream = maintain a local in-memory cache, periodically synced
#            (efficient, low per-request latency)
#   live   = query LAPI on every single request (simpler, slower,
#            more LAPI load)
MODE=stream

# How often (in seconds) to refresh the local decision cache from
# LAPI when MODE=stream. Lower = more current, more LAPI traffic.
UPDATE_FREQUENCY=10

# How long (in seconds/minutes depending on version) a cached
# decision is trusted before being treated as stale. Distinct from
# UPDATE_FREQUENCY — this governs local cache validity, not the
# sync interval itself.
CACHE_EXPIRATION=1

# What remedy to apply when a decision doesn't specify one, or as
# the default enforcement action. 'ban' = hard block (403/derived
# ban page); alternatives are typically 'captcha' or a custom type.
FALLBACK_REMEDIATION=ban

# Path to the HTML template shown to a banned visitor.
BAN_TEMPLATE_PATH=/var/lib/crowdsec/lua/templates/ban.html
