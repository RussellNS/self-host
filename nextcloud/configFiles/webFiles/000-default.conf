# ------------------------------------------------------------------------------------
# Global SSL/TLS Settings (Modern/Intermediate Security)
# ------------------------------------------------------------------------------------
# Only allow TLS 1.2 and 1.3. Disables older, vulnerable versions.
SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1

# Modern cipher suite favoring GCM and ChaCha20 for performance and security.
SSLCipherSuite          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384

# Let the client and server negotiate the best cipher available.
SSLHonorCipherOrder     off
SSLSessionTickets       off
SSLCompression          off

# OCSP Stapling: Improves privacy and speeds up the TLS handshake.
SSLUseStapling          on
SSLStaplingCache        "shmcb:${APACHE_LOG_DIR}/ssl_stapling(32768)"

# ------------------------------------------------------------------------------------
# Port 80: Permanent Redirect to HTTPS
# ------------------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName      example.com
    ServerAlias     example.com example.org 192.0.2.20
    ServerAdmin     user@example.com

    # Redirect all HTTP traffic to HTTPS using a 301 Permanent redirect.
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# ------------------------------------------------------------------------------------
# Port 443: Secure Nextcloud Instance
# ------------------------------------------------------------------------------------
<VirtualHost *:443>
    ServerName      example.com
    ServerAlias     example.com example.org 192.0.2.20
    ServerAdmin     user@example.com

    # Protocols: h2 (HTTP/2) is essential for Nextcloud's performance.
    # http/1.1 is kept as a fallback for older clients.

    # HTTP/2 (h2) is intentionally disabled in Apache (000-default.conf) on the
    # Nextcloud container. When h2 is enabled, browsers reuse existing HTTP/2
    # connections across hostnames if these conditios are met in the same session
    #   *  same destination IP (e.g. nginx rev proxy 192.0.2.9)
    #   *  same port (e.g. 443)
    #   *  same certificate (e.g. *.example.com)
    # Since Nextcloud (example.com) and OnlyOffice (office.example.com) share both
    # the proxy's external IP (192.0.2.9) and the wildcard cert
    # (*.example.com & *.example.com), a browser with an open OnlyOffice connection
    # will reuse it for subsequent Nextcloud requests — bypassing SNI preread
    # entirely and routing example.com traffic to onlyoffice_backend. Do not
    # re-enable h2 until this is resolved.

#    Protocols       h2 http/1.1
    Protocols       http/1.1

    DocumentRoot    /var/www/html

    SSLEngine on
    SSLCertificateKeyFile   /etc/ssl/example.com.key
    SSLCertificateFile      /etc/ssl/example.com.fullchain.pem

    # Required for Nextcloud: Passes the Authorization header to PHP.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # --------------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------------
    <IfModule mod_headers.c>
        # HSTS (Strict-Transport-Security): Forces browsers to use HTTPS for 1 year.
        #Header always set Strict-Transport-Security "max-age=15552000; includeSubDomains; preload"
        
        # Prevent browsers from "sniffing" the content type.
        Header always set X-Content-Type-Options "nosniff"
        
        # Prevent site from being embedded in frames on other domains.
        Header always set X-Frame-Options "SAMEORIGIN"
        
        # Control how much info is shared when clicking links to other sites.
        Header always set Referrer-Policy "no-referrer"
        
        # Block search engines from indexing the site (optional, keep if lab environment).
        Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"

        # Modern Permissions Policy (replaces Feature-Policy).
        Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=()"

        # Service discovery redirects for CardDAV/CalDAV (iOS/macOS compatibility).
        Redirect 301 /.well-known/carddav /remote.php/dav
        Redirect 301 /.well-known/caldav  /remote.php/dav
    </IfModule>

    # --------------------------------------------------------------------------------
    # Proxy Logic for Nextcloud App API (exapps)
    # --------------------------------------------------------------------------------
    ProxyRequests       Off
    ProxyPreserveHost   On

    <Location /exapps/>
        ProxyPass           http://nextcloud_appapi-harp:8780/exapps/
        ProxyPassReverse    http://nextcloud_appapi-harp:8780/exapps/
        RewriteEngine       Off
        Require             all granted
    </Location>

    # --------------------------------------------------------------------------------
    # Directory Configuration
    # --------------------------------------------------------------------------------
    <Directory "/var/www/html">
        Options +FollowSymLinks +MultiViews
        AllowOverride All
        
        <IfModule mod_dav.c>
            Dav off
        </IfModule>

        SetEnv HOME /var/www/html
        SetEnv HTTP_HOME /var/www/html
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/nextcloud_error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud_access.log combined

</VirtualHost>
