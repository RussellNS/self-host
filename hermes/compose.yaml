# NETWORK INFO
# The 'networks:' section assigns a service to a user created network.
#
# In order for this 'compose.yaml' file to work, the following Docker network
# must be created before hand:
#
#   Use this for QNAP NAS devices
#   docker network create -d qnet --ipam-driver=qnet --ipam-opt=iface=eth4 --subnet=198.51.100.0/24 --gateway 198.51.100.1 macvlan_net --opt=iface=eth4
#     *  Reference: https://qnap-dev.github.io/container-station-api/qnet.html
#
#   Use this for standard Docker
#   docker network create -d macvlan --subnet=198.51.100.0/24 --gateway=198.51.100.1 -o parent=ens33 macvlan_net
#                            |     |          |             |           |          |           |   | |         |
#                            +-----+          +-------------+           +----------+           +---+ +----+----+
#                               |                    |                       |                   |        |
#   This needs to match the ----+                    |                       |                   |        |
#   driver used for the                              |                       |                   |        |
#   network (the default driver                      |                       |                   |        |
#   for macvlan networks in Docker                   |                       |                   |        |
#   is 'macvlan', the default                        |                       |                   |        |
#   for QNAP NAS is 'qnet'.                          |                       |                   |        |
#                                                    |                       |                   |        |
#   This needs to match the subnet in  --------------+                       |                   |        |
#   your environment.                                                        |                   |        |
#                                                                            |                   |        |
#   This needs to match the IP of your --------------------------------------+                   |        |
#   gateway.                                                                                     |        |
#                                                                                                |        |
#   This needs to match the name of    ----------------------------------------------------------+        |
#   your interface (NIC).                                                                                 |
#                                                                                                         |
#   This can be any user assigned ------------------+-----------------------------------------------------+
#   value, but both of these need                   |
#   to match.                                       |
#                                                   |
#      +--------------------------------------------+
#      |
# +----+----+
# |         |
networks:
  macvlan_net:
    external: true

#volumes:
#  data:

x-all-services: &all-svcs
  restart: unless-stopped
#  dns_search: example.com
  dns:
    - 198.51.100.10
  # Exclude/drop network capabilities for the container
  cap_drop:
    # Reduce the ability of a compromised agent to perform low-level (raw) network
    # reconnaissance or packet manipulation from inside the container, but still
    # allow higher level protocols, like: HTTP, HTTPS, and DNS, etc.
    - NET_RAW
    # Limits the agent's ability to change networking configs from inside the container
    # without blocking network connections, like connecting to remote services,
    # downloading files, etc.
    - NET_ADMIN
  security_opt:
    # Prevent any processes inside the container (and their descendants) from gaining
    # additional privileges
    - no-new-privileges:true

x-all-health: &all-health
  interval: 10m
  timeout: 10s
  retries: 5
  start_period: 2m
  start_interval: 10s

services:
  nginx:
    <<: *all-svcs
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile_nginx-v1.30_stable-alpine
      args:
        IMAGE_VERSION: ${NGINX_VERSION}
        MAXMIND_KEY: ${MAXMIND_KEY}
    container_name: hermes_nginx
    hostname: hermes-nginx
    networks:
      default:
      macvlan_net:
        ipv4_address: 192.0.2.36
        mac_address: 02:42:0A:0A:05:24
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      <<: *all-health
    volumes:
      # Volumes used for PERSISTANT DATA (NOT TESTING - these do not get deleted, even with '-v')
      - ./configFiles/nginx.conf:/etc/nginx/nginx.conf:ro
      # Files used for SSL/TLS CERTS - Cert files must be 1000:1000 (UID:GID)
      - /path/to/ssl/n8n.cert.pem:/etc/ssl/example.com.pem:ro
      - /path/to/ssl/n8n.example.com_privkey.pem:/etc/ssl/example.com.key:ro
      - /path/to/ssl/n8n.example.com_fullchain.pem:/etc/ssl/example.com.fullchain.pem:ro

  app:
    <<: *all-svcs
    build:
      context: .
      dockerfile: ./Dockerfiles/Dockerfile_hermes
      args:
        IMAGE_VERSION: ${HERMES_VERSION}
    container_name: hermes_app
    hostname: hermes-gw
#    user: 1000:1000
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    # Using 'ports:' vs 'expose:'
    #   *  'ports:'   presents the ports externally (usually addressed as host_ip:port)
    #   *  'expose:'  presents the ports internally (used for container to container traffic)
#    expose:
#      - "8642:8642"
#      - "9119:9119"
    environment:
      # ENV variables defined in a '.env' file.  View with 'ls -lha'.
      # AUTOMATIC LOADING
      # If a '.env' file is in the same directory as the 'compose.yaml' file, it will
      # automatically be loaded.
      # USAGE
      # Variables in this file can be referenced in the 'compose.yaml' file anywhere,
      # not just in the 'environment:' section.  Referencing works like this:
      #   *  ${variable_name}
      #   *  ${variable_name:-default_value}
      # NOTE: Putting ENV values in a '.env' file helps to obfuscate passwords from the 'compose.yaml'.
      #       Doing it this way allows for seeking online help without
      #       disclosing passwords.
      TZ: ${TZ}
      # HERMES user/group
      HERMES_UID:  1000
      HERMES_GUID: 1000
      # HERMES API server
      API_SERVER_ENABLED: "true"
      # HERMES dashboard
      HERMES_DASHBOARD: "1"
#      HERMES_DASHBOARD_HOST: 0.0.0.0
#      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_PUBLIC_URL: https://hermes.example.com
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${BASIC_AUTH_SECRET}
    command: gateway run
    healthcheck:
#      test: [ "CMD-SHELL", "python -c import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)" ]
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5)",
        ]
      <<: *all-health
    volumes:
      # Volumes used for TESTING (they get deleted with 'docker-compose down -v')
#      - data:/opt/data:rw
      # Volumes used for PERSISTANT DATA (NOT TESTING - these do not get deleted, even with '-v')
#      - /path/to/scripts/Hermes_2026-10-27:/opt/data:rw
      # 1. Runtime/state data: sessions, logs, state DB, caches, etc.
      - /path/to/volumes/hermes_data:/opt/data:rw
      # 2. User-editable working files, overlaid on top of /opt/data
      - /path/to/scripts/Hermes/skills:/opt/data/skills:rw
      - /path/to/scripts/Hermes/secrets:/opt/data/secrets:rw
      - /path/to/scripts/Hermes/config.yaml:/opt/data/config.yaml:rw
      - /path/to/scripts/Hermes/cron/jobs.json:/opt/data/cron/jobs.json:rw
      - /path/to/scripts/Hermes/SOUL.md:/opt/data/SOUL.md:rw
      - /path/to/scripts/Hermes/MEMORY.md:/opt/data/memories/MEMORY.md:rw
#      - /path/to/scripts/Hermes/.env:/opt/data/.env:rw
