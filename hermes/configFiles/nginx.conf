# -------------------------------------------------------------------------
# 💻 NGINX Configuration for Single, App Specific HTTP Reverse Proxy
#    (e.g. VS Code Server)
# -------------------------------------------------------------------------

# ----------------------------------
# 1. Global Settings
# ----------------------------------

# Defines the user Nginx worker processes will run as (important for security)
user  nginx nginx;

# Sets the number of worker processes
# 'auto' matches the number of CPU cores for optimal performance
worker_processes auto;

# Loads essential external modules needed for GeoIP2 functionality
# 🌐 GeoIP2 is required to look up the geographic location of the client IP
load_module modules/ngx_http_geoip2_module.so;

# ----------------------------------
# 2. Event Settings
# ----------------------------------

events {
    # Sets the maximum number of simultaneous connections that a worker
    # process can handle.
    worker_connections 1024;
}

# ----------------------------------
# 3. HTTP Block (The Main Web/Application Layer)
# ----------------------------------

http {
    # ----------------------------------
    # 3A. HTTP - Block Variables
    # ----------------------------------

    # Includes file extensions and MIME types (e.g., text/html, image/png)
    include               mime.types;

    # Sets a default type for files not recognized by mime.types
    default_type          application/octet-stream;

    # Enables an optimization to send files directly between descriptors
    sendfile              on;

    # How long a client connection should stay open for subsequent requests
    keepalive_timeout     65;

    proxy_connect_timeout 90;
    proxy_send_timeout    90;
    proxy_read_timeout    90;

    # This map checks if the client is trying to upgrade to a WebSocket connection.
    # If the 'Upgrade' header is present, we set 'Connection' to 'upgrade' (required for WebSocket).
    # If it's missing, we set 'Connection' to 'close' for regular HTTP requests.
    # This helps Nginx handle both WebSocket and normal traffic correctly.
    map $http_upgrade $connection_upgrade {
        default upgrade;  # WebSocket handshake
        ''      close;    # Regular HTTP
    }

    # ----------------------------------
    # 3B. HTTP - TLS/SSL Certificates
    # ----------------------------------

    # 🔐 Defines the path to the combined certificate chain (fullchain.pem)
    ssl_certificate     /etc/ssl/example.com.fullchain.pem;
    # 🔑 Defines the path to the private key
    ssl_certificate_key /etc/ssl/example.com.key;

    # ----------------------------------
    # 3B. STREAM - GeoIP2
    # ----------------------------------

    # 🗺️ GeoIP2 Configuration - City Database
    # This block extracts detailed location data (city, state, coordinates).
    # for logging purposes
    geoip2 GeoIP2/GeoLite2-City.mmdb {
        auto_reload 1d;
        $geoip2_data_city_name   city names en;
        $geoip2_data_postal_code postal code;
        $geoip2_data_latitude    location latitude;
        $geoip2_data_longitude   location longitude;
        $geoip2_data_state_name  subdivisions 0 names en;
        $geoip2_data_state_code  subdivisions 0 iso_code;
    }

    # 🌍 GeoIP2 Configuration - Country Database
    # This block defines the country ISO code (e.g., US, CA, DE)
    geoip2 GeoIP2/GeoLite2-Country.mmdb {

        # Automatically reload the database every 24 hours
        auto_reload 1d;

        $geoip2_data_continent_code   continent code;

        $geoip2_data_country_iso_code country iso_code;
    }

    # ----------------------------------
    # 3D. HTTP - Server Block (The Application Endpoint)
    # ----------------------------------

    server {
        listen       80;
        listen  [::]:80;

        server_name  ai.example.com;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }

        location / {
            return 302 https://$host$request_uri;
        }
    }

    server {
        # 👂 Listen for direct connections (Client -> This Proxy) on standard HTTPS (443)
        listen 443 ssl default_server;

        # 👂 Listen for proxyed traffic (on 8443) from another NGINX/Load Balancer
        # It uses 'proxy_protocol' to extract the original client IP.
        # Flow: Internet -> External Proxy -> This Proxy (8443) -> App
        listen 8443 ssl proxy_protocol;
        # Tells NGINX to use the PROXY header to determine the real client IP
        real_ip_header proxy_protocol;
        # Trusts the external reverse proxy (192.0.2.8) to provide the real IP
        set_real_ip_from 192.0.2.8;

        # 📛 Server names (Hostnames) this configuration block responds to
        server_name ai.example.com ai.example.com ai.example.org;

        # 🔑 Redefine SSL certificates for this specific server block
        ssl_certificate     /etc/ssl/example.com.fullchain.pem;
        ssl_certificate_key /etc/ssl/example.com.key;

        # 📦 Maximum Upload Size
        # Sets the maximum size of client uploads. Prevents NGINX from
        # returning a 413 error before the request reaches the upstream app.
        client_max_body_size 50M;

        location / {
            # ➡️ Reverse Proxy Configuration

            # Forwards traffic to the OpenClaw gateway by Docker container
            # name. Works because this nginx container and the gateway
            # container are both on the same Compose project's "default"
            # network, so Docker's embedded DNS resolves the container
            # name directly - no IP needed, unlike a cross-project setup.
            proxy_pass http://hermes_app:9119;

            # Pass the original Host header to the upstream server
            proxy_set_header Host $host;

            # Pass the actual client IP
            proxy_set_header X-Real-IP $remote_addr;
            # Appends the client IP to the list of proxies traversed
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Indicate the protocol used to reach NGINX (http or https)
            proxy_set_header X-Forwarded-Proto $scheme;

            # ⚡️ WebSocket support (REQUIRED — OpenClaw's Control UI speaks
            # directly to the Gateway over a WebSocket on this same port,
            # not just plain HTTP, so this block is not optional the way
            # it might be for a purely page-based app.)
            #
            # NOTE: WebSockets upgrade negotiation requires HTTP/1.1,
            #       HTTP/2/3 lack this mechanism.  The directive
            #       "proxy_http_version 1.1" below ensures proper
            #       handshake and persistent tunnel.
            proxy_http_version 1.1;
            # Request the connection upgrade to WebSocket
            proxy_set_header Upgrade $http_upgrade;
            # Standard header to maintain the persistent connection
            proxy_set_header Connection "upgrade";

            # OpenClaw's Gateway WebSocket can stay open for long agent
            # runs; the global proxy_read_timeout (90s) may be too short
            # for a long-lived idle connection. Override it here so the
            # WebSocket isn't dropped mid-session.
            proxy_read_timeout 3600s;
        }
    }

    # ----------------------------------
    # 3E. HTTP - Logging Configuration
    # ----------------------------------

    # 📊 Defines a custom JSON log format for easy parsing and ingestion
    log_format geoip_json escape=json '{'
        '"TIME": {'
            '"time_local": "$time_local"'
        '}, '
        '"REMOTE_INFO": {'
            '"remote_addr": "$remote_addr"'
        '}, '
        '"GEO_INFO": {'
            '"CONTINENT": "$geoip2_data_continent_code", '
            '"COUNTRY": "$geoip2_data_country_iso_code"'
        '}, '
        '"VSCODE_VARIABLES": {'
            '"request": "$request", '
            '"status": "$status", '
            '"body_bytes_sent": "$body_bytes_sent", '
            '"http_referer": "$http_referer", '
            '"http_user_agent": "$http_user_agent"'
        '}, '
        '"SESSION_INFO": {'
            '"msec": "$msec", '
            '"request_time": "$request_time", '
            '"upstream_addr": "$upstream_addr", '
            '"upstream_response_time": "$upstream_response_time", '
            '"upstream_status": "$upstream_status"'
        '}'
    '}';

    # This map defines a variable `$log_4xx` used to selectively log all client-side HTTP errors (4xx).
    # It enables conditional logging of authentication failures, rate limits, and malformed requests
    # without cluttering the main access log. Useful for Fail2Ban, audit trails, or debugging login flows.
    map $status $log_4xx {
        default 0;      # Do not log by default

        400     1;      # Bad Request – malformed syntax or invalid request
        401     1;      # Unauthorized – authentication required or failed
        402     1;      # Payment Required – reserved for future use
        403     1;      # Forbidden – authenticated but not authorized
        404     1;      # Not Found – resource doesn't exist
        405     1;      # Method Not Allowed – unsupported HTTP method
        406     1;      # Not Acceptable – content negotiation failed
        407     1;      # Proxy Authentication Required – proxy auth needed
        408     1;      # Request Timeout – client took too long
        409     1;      # Conflict – request conflicts with server state
        410     1;      # Gone – resource permanently removed
        411     1;      # Length Required – missing Content-Length header
        412     1;      # Precondition Failed – conditional request failed
        413     1;      # Payload Too Large – request body too big
        414     1;      # URI Too Long – request URI too long
        415     1;      # Unsupported Media Type – unsupported content type
        416     1;      # Range Not Satisfiable – invalid range header
        417     1;      # Expectation Failed – `Expect` header not met
        418     1;      # I'm a teapot – RFC 2324 Easter egg
        421     1;      # Misdirected Request – wrong server
        422     1;      # Unprocessable Entity – semantic error in request
        423     1;      # Locked – resource is locked
        424     1;      # Failed Dependency – previous request failed
        425     1;      # Too Early – premature request
        426     1;      # Upgrade Required – client must switch protocols
        428     1;      # Precondition Required – missing preconditions
        429     1;      # Too Many Requests – rate limiting triggered
        431     1;      # Request Header Fields Too Large – headers too big
        451     1;      # Unavailable For Legal Reasons – censored content
    }

    # 📝 Access Log: Writes successful connections using the JSON format
    access_log /var/log/nginx/nginx_access.log geoip_json;
    # 📝 Access Log: Writes unsuccessful login issues using the JSON format
    access_log /var/log/nginx/nginx_fail2ban.log geoip_json if=$log_4xx;
    # 🛑 Error Log: Writes critical warnings and errors
    error_log  /var/log/nginx/nginx_error.log;
}
